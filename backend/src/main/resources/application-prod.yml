server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  testing:
    standard-recruiter-full-access: false

spring:
  jpa:
    show-sql: false
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      validation-timeout: 5000
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:true}

# Production must supply its own signing key; never inherit the development fallback.
jwt:
  secret: ${JWT_SECRET}

# Enforce Secure on browser refresh cookies behind the HTTPS reverse proxy.
---
app:
  security:
    refresh-cookie-secure: true
