services:
  mailpit:
    image: axllent/mailpit:v1.30.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
    volumes:
      - mailpit_data:/data
  postgres:
    image: pgvector/pgvector:pg16
    container_name: airecruit-postgres-pgvector
    restart: always
    environment:
      POSTGRES_DB: airecruit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres_secure_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airecruit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mailpit_data:
  postgres_data:
    driver: local
