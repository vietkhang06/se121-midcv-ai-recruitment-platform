name: Offline CI

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_CLASSIFICATION: OFFLINE_DETERMINISTIC

jobs:
  changes:
    name: Detect changed scopes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      worker: ${{ steps.filter.outputs.worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="${GITHUB_SHA}^"
          fi

          changed=$(git diff --name-only "$base...$GITHUB_SHA")
          printf '%s\n' "$changed"

          backend=false
          worker=false
          frontend=false
          if grep -Eq '^(backend/|scripts/check_module_boundaries\.py|scripts/module-boundary-baseline\.json|scripts/ci/)' <<< "$changed"; then backend=true; fi
          if grep -Eq '^(ai-worker/|scripts/tests/)' <<< "$changed"; then worker=true; fi
          if grep -Eq '^frontend/' <<< "$changed"; then frontend=true; fi

          {
            echo "backend=$backend"
            echo "worker=$worker"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend / PostgreSQL tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: airecruit_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d airecruit_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/airecruit_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres_secure_pass
      WORKER_ENABLED: "false"
      EMAIL_MODE: MOCK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Check module dependency regressions
        run: python scripts/check_module_boundaries.py
      - name: Run backend tests
        id: tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          mvn -B test 2>&1 | tee ../backend-test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cd ..
          python scripts/ci/verify_debt_baseline.py backend backend-test.log
      - name: Run scoped acceptance tests
        working-directory: backend
        run: >-
          mvn -B
          -Dtest=OAuthServiceStateTest,TaskHttpAcceptanceTest,InboxIntegrationTest,InboxOutboxTransactionTest,SpringSecurityRbacAndMultiTenantIntegrationTest,CompanyVerificationContextLoadTest,PaginationApiIntegrationTest
          test
      - name: Build backend evidence
        if: always()
        shell: bash
        run: |
          python scripts/ci/sanitize_log.py backend-test.log evidence/backend-test.log
          reports=$(find backend/target/surefire-reports -name 'TEST-*.xml' 2>/dev/null | wc -l)
          cat > evidence/backend-summary.md <<EOF
          # Backend offline result

          - Classification: ${EVIDENCE_CLASSIFICATION}
          - Commit: ${GITHUB_SHA}
          - Command: \`cd backend && mvn -B test\`
          - Exit code: ${{ steps.tests.outputs.exit_code || 'NOT_RUN' }}
          - JUnit report files: ${reports}
          - PostgreSQL: pgvector/pgvector:pg16 service
          - External AI/GitHub providers: not configured
          EOF
          cat evidence/backend-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-backend-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            evidence/backend-summary.md
            evidence/backend-test.log
            backend/target/surefire-reports/TEST-*.xml

  worker:
    name: AI worker / deterministic tests
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LLM_PRIMARY_ENABLED: "false"
      ENABLE_DEV_AI_TEST_ENDPOINTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-worker/requirements.txt
      - name: Install native OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie
          tesseract --list-langs | grep -Fx eng
          tesseract --list-langs | grep -Fx vie
      - name: Install worker dependencies
        working-directory: ai-worker
        run: python -m pip install -r requirements.txt pytest
      - name: Run worker and evidence tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest ai-worker/tests scripts/tests -m "not live" --junitxml=evidence/worker-junit.xml 2>&1 | tee worker-test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Build worker evidence
        if: always()
        shell: bash
        run: |
          python scripts/ci/sanitize_log.py worker-test.log evidence/worker-test.log
          cat > evidence/worker-summary.md <<EOF
          # AI worker offline result

          - Classification: ${EVIDENCE_CLASSIFICATION}
          - Commit: ${GITHUB_SHA}
          - Command: \`python -m pytest ai-worker/tests scripts/tests -m "not live" --junitxml=evidence/worker-junit.xml\`
          - Exit code: ${{ steps.tests.outputs.exit_code || 'NOT_RUN' }}
          - OCR: native Tesseract with eng+vie
          - External provider: disabled; no paid API calls
          EOF
          cat evidence/worker-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-worker-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            evidence/worker-summary.md
            evidence/worker-test.log
            evidence/worker-junit.xml

  frontend:
    name: Frontend / lint contracts build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend gates
        id: tests
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee ../frontend-test.log
          lint_code=${PIPESTATUS[0]}
          npm run test:contracts 2>&1 | tee -a ../frontend-test.log
          contract_code=${PIPESTATUS[0]}
          npm run typecheck 2>&1 | tee -a ../frontend-test.log
          typecheck_code=${PIPESTATUS[0]}
          npm run build 2>&1 | tee -a ../frontend-test.log
          build_code=${PIPESTATUS[0]}
          npx playwright test e2e/motion-system.spec.ts --project=chromium-desktop --grep "page navigation|wheel input|landing motion" 2>&1 | tee -a ../frontend-test.log
          motion_e2e_code=${PIPESTATUS[0]}
          {
            echo "lint_code=$lint_code"
            echo "contract_code=$contract_code"
            echo "typecheck_code=$typecheck_code"
            echo "build_code=$build_code"
            echo "motion_e2e_code=$motion_e2e_code"
          } >> "$GITHUB_OUTPUT"
          cd ..
          python scripts/ci/verify_debt_baseline.py frontend frontend-test.log
          baseline_code=$?
          exit $((baseline_code || contract_code || typecheck_code || build_code || motion_e2e_code))
      - name: Build frontend evidence
        if: always()
        shell: bash
        run: |
          python scripts/ci/sanitize_log.py frontend-test.log evidence/frontend-test.log
          cat > evidence/frontend-summary.md <<EOF
          # Frontend offline result

          - Classification: ${EVIDENCE_CLASSIFICATION}
          - Commit: ${GITHUB_SHA}
          - Lint exit code: ${{ steps.tests.outputs.lint_code || 'NOT_RUN' }}
          - Contract exit code: ${{ steps.tests.outputs.contract_code || 'NOT_RUN' }}
          - TypeScript exit code: ${{ steps.tests.outputs.typecheck_code || 'NOT_RUN' }}
          - Build exit code: ${{ steps.tests.outputs.build_code || 'NOT_RUN' }}
          - Targeted motion E2E exit code: ${{ steps.tests.outputs.motion_e2e_code || 'NOT_RUN' }}
          EOF
          cat evidence/frontend-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-frontend-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            evidence/frontend-summary.md
            evidence/frontend-test.log
