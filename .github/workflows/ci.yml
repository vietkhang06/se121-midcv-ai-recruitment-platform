name: AI Recruitment Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, "feature/**" ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Spring Boot Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and Test Backend with Maven
        run: mvn test
        working-directory: backend

  python-worker-test:
    name: Python AI Worker Pytest Suite (Real OCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-worker/requirements.txt
      - name: Install Native Tesseract OCR & Bilingual Language Packs
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie
          tesseract --version
          tesseract --list-langs
          if ! tesseract --list-langs | grep -q "eng"; then
            echo "ERROR: eng traineddata is missing"
            exit 1
          fi
          if ! tesseract --list-langs | grep -q "vie"; then
            echo "ERROR: vie traineddata is missing"
            exit 1
          fi
      - name: Install AI Worker Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
        working-directory: ai-worker
      - name: Run Pytest Test Suite
        run: pytest
        working-directory: ai-worker

  frontend-build-and-e2e:
    name: Next.js Frontend Build & Playwright E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: airecruit_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airecruit_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Spring Boot Backend
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/airecruit_db
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres_secure_pass
          WORKER_ENABLED: 'false'
        run: |
          nohup mvn spring-boot:run > ../backend-ci.log 2>&1 &

      - name: Wait for Backend
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/jobs || true)
            if [ "$code" != "000" ]; then
              echo "Backend is ready with HTTP $code"
              exit 0
            fi
            sleep 2
          done
          cat backend-ci.log
          exit 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Next.js Production Bundle
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E Test Suite
        run: npx playwright test
        working-directory: frontend

      - name: Upload Backend Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-log
          path: backend-ci.log

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore