name: AI Recruitment Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Spring Boot Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and Test Backend with Maven
        run: mvn test
        working-directory: backend

  python-worker-test:
    name: Python AI Worker Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install AI Worker Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
        working-directory: ai-worker
      - name: Run Pytest Test Suite
        run: pytest
        working-directory: ai-worker

  frontend-build-and-e2e:
    name: Next.js Frontend Build & Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend
      - name: Build Next.js Production Bundle
        run: npm run build
        working-directory: frontend
      - name: Install Playwright Browsers
        run: npx playwright install chromium
        working-directory: frontend
      - name: Run Playwright E2E Test Suite
        run: npx playwright test
        working-directory: frontend
